<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Deployment Practical</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      max-width: 720px;
      width: 100%;
      background: white;
      padding: 42px;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { color: #155eef; margin-top: 0; }
    p { line-height: 1.7; }
    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e8f0ff;
      color: #155eef;
      font-weight: bold;
      margin: 12px 0;
    }
    footer { margin-top: 28px; color: #667085; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Experiment No. 8</div>
    <h1>Automated Deployment Using GitHub</h1>
    <p>This sample website is deployed automatically using GitHub Actions and GitHub Pages.</p>
    <p>Whenever you update and push this project to the GitHub repository, the workflow builds and deploys the website.</p>
    <footer>ASDD Practical • HTML + GitHub Actions</footer>
  </main>
</body>
</html>
